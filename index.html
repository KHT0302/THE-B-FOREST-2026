<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE1">
<style>body{margin:0}img{max-width:100%}</style>
<title>THE B FOREST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: a record crate in your pocket. Paper sleeve pages, grain-gradient bands per deck, every booth is a track on an LP. */
:root{
  --paper:#F4EEE1; --paper-deep:#EAE1CF; --ink:#151413; --ink-soft:#5B544C; --rule:rgba(21,20,19,.16);
  --food:#D9482B; --play:#2B64A8; --make:#7650B0; --green:#2E8B4E; --sticker:#F7CE3E; --onair:#E2483A;
  --white:#FFFDF8; --shade:rgba(21,20,19,.92);
  --g-a:linear-gradient(160deg,#EA5A46 0%,#F08A5A 34%,#F6C9A4 68%,#F7EEE2 100%);
  --g-b:linear-gradient(160deg,#78AFE2 0%,#AFD3EE 40%,#DCEDC0 76%,#F2F3E2 100%);
  --g-mix:linear-gradient(118deg,#EC6550 0%,#F4AA78 32%,#F1E5D8 54%,#B7D6EE 78%,#93C2E8 100%);
  --g-food:linear-gradient(160deg,#E0473A 0%,#F09A84 52%,#F8E3D7 100%);
  --g-play:linear-gradient(160deg,#2D63AD 0%,#86B4E1 52%,#E5EEF4 100%);
  --g-make:linear-gradient(160deg,#7954B3 0%,#C49AD6 52%,#F3E4EE 100%);
  --g-green:linear-gradient(160deg,#2B7C47 0%,#8DC38A 52%,#E7F1D8 100%);
  --l-food:radial-gradient(circle at 35% 30%,#FFF3EE,#F6C2B4);
  --l-play:radial-gradient(circle at 35% 30%,#F3F9FE,#BCD9F2);
  --l-make:radial-gradient(circle at 35% 30%,#FBF2F8,#CDB6E6);
  --l-green:radial-gradient(circle at 35% 30%,#F3FBEF,#C6E6B4);
  --f-disp:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,"Noto Sans KR","Apple SD Gothic Neo",monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --nav-h:58px;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{word-break:keep-all;background:url(img/grain_soft.png),var(--paper);color:var(--ink);font-family:var(--f-disp);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.gut{padding-left:var(--gut);padding-right:var(--gut-r)}
.band{position:relative;isolation:isolate;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background:url(img/grain.png);opacity:.6;z-index:-1;pointer-events:none}
.g-a{background:var(--g-a)} .g-b{background:var(--g-b)} .g-mix{background:var(--g-mix)}
.g-FOOD{background:var(--g-food)} .g-PLAY{background:var(--g-play)} .g-MAKE{background:var(--g-make)} .g-GREEN{background:var(--g-green)}
.c-FOOD{--c:var(--food)} .c-PLAY{--c:var(--play)} .c-MAKE{--c:var(--make)} .c-GREEN{--c:var(--green)}
svg.trees{width:28px;height:18px;stroke:currentColor;fill:none;stroke-width:3.2}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font:700 12px/1 var(--f-mono);letter-spacing:.14em}
.sound{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;border:1.5px solid var(--ink);border-radius:999px;padding:7px 11px;display:flex;align-items:center;gap:6px}
.sound i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.25}
.sound[aria-pressed="true"] i{background:var(--onair);opacity:1}

/* views */
main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{animation:vin .32s ease both}
@keyframes vin{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding-top:30px;padding-bottom:12px;color:var(--ink)}
.sec-h span:last-child{color:var(--ink-soft)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:var(--gut);padding-right:var(--gut-r)}
.nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);max-width:560px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;font:600 10px/1 var(--f-mono);letter-spacing:.12em;opacity:.55}
.nav a i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0}
.nav a[aria-current="page"]{opacity:1}
.nav a[aria-current="page"] i{opacity:1;background:var(--sticker)}

/* records */
.rec{position:relative;aspect-ratio:1;border-radius:50%;max-width:100%}
.rec img{width:100%;height:100%;display:block}
.spin{animation:spin var(--rpm,1.8s) linear infinite}
.spin.r45{--rpm:1.33s}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;left:27.1%;top:27.1%;width:45.8%;height:45.8%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%;box-sizing:border-box;color:var(--ink);overflow:hidden}
.label::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 9px,rgba(0,0,0,.05) 9px 10px);pointer-events:none}
.label .hole{position:absolute;left:50%;top:50%;width:5%;height:5%;margin:-2.5% 0 0 -2.5%;border-radius:50%;background:#0b0b0b;z-index:2}
.l-FOOD{background:var(--l-food)} .l-PLAY{background:var(--l-play)} .l-MAKE{background:var(--l-make)} .l-GREEN{background:var(--l-green)}

/* sticker */
.sticker{position:absolute;width:112px;height:112px;border-radius:50%;background:var(--sticker);transform:rotate(-10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 18px rgba(60,30,0,.22);color:var(--ink)}
.sticker::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(21,20,19,.55)}
.sticker small{font:700 7.5px/1 var(--f-mono);letter-spacing:.12em}
.sticker s{font:600 9px/1.4 var(--f-mono);opacity:.6}
.sticker b{font:900 30px/1 var(--f-disp);letter-spacing:-.04em}
.sticker em{font:700 10px/1.3 var(--f-mono);font-style:normal;letter-spacing:.2em}

/* HOME */
.hero{padding-top:26px;padding-bottom:30px}
.hero .kick{font:600 11px/1.4 var(--f-mono);letter-spacing:.14em}
.hero h1{margin:14px 0 0;font:900 clamp(64px,22vw,112px)/.86 var(--f-disp);letter-spacing:-.05em}
.hero .date{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:18px}
.hero .date b{font:700 26px/1 var(--f-mono);letter-spacing:.02em}
.hero .date span{font:500 13px/1.4 var(--f-disp)}
.hero .sticker{right:var(--gut-r);top:22px}
.hero .tag{margin-top:14px;font:500 14px/1.6 var(--f-disp);max-width:30ch}

.np{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding-block:16px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;width:100%;text-align:left}
.np .mini{width:44px;height:44px}
.np .k{font:700 10.5px/1 var(--f-mono);letter-spacing:.14em;display:flex;gap:8px;align-items:center}
.np .k .dot{width:7px;height:7px;border-radius:50%;background:var(--onair);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.np .t{font:900 19px/1.25 var(--f-disp);margin-top:5px;letter-spacing:-.02em}
.np .s{font:500 12.5px/1.4 var(--f-disp);color:var(--ink-soft);margin-top:2px}
.np .bar{height:3px;background:var(--rule);margin-top:9px;position:relative}
.np .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.np .go{font:700 10.5px/1 var(--f-mono);letter-spacing:.1em}

.console{border-radius:18px;padding:16px 12px 14px;display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:start}
.deckbtn{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.deckbtn .rec{width:100%;filter:drop-shadow(0 10px 12px rgba(40,20,10,.28))}
.deckbtn b{font:700 12px/1 var(--f-mono);letter-spacing:.12em}
.deckbtn span{display:block;font:500 12px/1.35 var(--f-disp);margin-top:4px}
.deckbtn small{display:block;font:600 9.5px/1 var(--f-mono);letter-spacing:.1em;opacity:.7;margin-top:5px}
.mixbtn{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:2px}
.mixbtn svg{width:100%;height:auto}
.mixbtn b{font:700 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-align:center}

.genres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.genre{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:14px 12px;border:1.5px solid var(--ink);border-radius:14px;text-align:left;background:var(--white)}
.genre .dot{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:900 17px/1 var(--f-disp)}
.genre b{display:block;font:700 13px/1 var(--f-mono);letter-spacing:.1em}
.genre span{display:block;font:500 12.5px/1.3 var(--f-disp);color:var(--ink-soft);margin-top:5px}
.genre.gz .dot{border-radius:999px;font-size:10px;font-family:var(--f-mono);letter-spacing:.06em}

.mapcard{display:block;width:100%;text-align:left;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding-block:14px}
.mapcard .m{background:var(--paper-deep);border-radius:12px;padding:8px;margin-top:10px}
.mapcard .m svg{width:100%;height:auto;display:block}
.mapcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mapcard b{font:900 22px/1.1 var(--f-disp);letter-spacing:-.02em}
.mapcard span{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em}
.foot{padding-top:34px;font:500 12px/1.7 var(--f-disp);color:var(--ink-soft)}
.foot a{font:600 12px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink)}

/* TRACKS */
.filt{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--ink);border-radius:999px;padding:7px 12px;font:600 11px/1 var(--f-mono);letter-spacing:.1em}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sidehead{padding-top:26px;padding-bottom:26px;min-height:190px}
.sidehead .rec{position:absolute;right:-70px;top:22px;width:190px}
.sidehead h2{margin:0;font:900 64px/.9 var(--f-disp);letter-spacing:-.05em}
.sidehead .meta{margin-top:12px;font:600 10.5px/1.7 var(--f-mono);letter-spacing:.08em;max-width:calc(100% - 140px)}
.sidehead .ko{font:700 17px/1.3 var(--f-disp);margin-top:12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-bottom:1px solid var(--rule)}
.tl li[hidden]{display:none}
.trk{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding-block:14px}
.badge{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:900 13px/1 var(--f-disp);letter-spacing:-.02em}
.badge.gz{width:auto;padding:0 8px;border-radius:999px;font:700 8.5px/1 var(--f-mono)}
.trk .n{font:700 16px/1.3 var(--f-disp);letter-spacing:-.01em;display:block}
.trk .o{font:500 12.5px/1.3 var(--f-disp);color:var(--ink-soft);display:block;margin-top:3px}
.trk .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.trk .cat{font:700 10px/1 var(--f-mono);letter-spacing:.1em;color:var(--c)}
.pill{font:700 9px/1 var(--f-mono);letter-spacing:.08em;border:1.2px solid var(--ink);border-radius:999px;padding:4px 7px}
.pill.fill{background:var(--ink);color:var(--paper)}
.empty{padding:22px 0;font:500 13px/1.6 var(--f-disp);color:var(--ink-soft)}

/* BOOTH SHEET */
.sheet{position:fixed;inset:0;z-index:40;background:url(img/grain_soft.png),var(--paper);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .bar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;height:52px;background:var(--paper);border-bottom:1px solid var(--rule)}
.sheet .bar button{font:700 11px/1 var(--f-mono);letter-spacing:.1em;padding:10px 0}
.sheet .bar .tn{display:flex;gap:18px}
.stage{padding-top:26px;padding-bottom:26px;display:flex;justify-content:center}
.stage .rec{width:min(80vw,340px);filter:drop-shadow(0 18px 22px rgba(30,10,0,.32))}
.stage .platter{position:relative}
.stage .hint{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);font:600 9.5px/1 var(--f-mono);letter-spacing:.14em;white-space:nowrap;opacity:.7;padding-top:8px}
.label .lt{font:700 clamp(7px,2.2vw,9px)/1 var(--f-mono);letter-spacing:.12em}
.label .ln{font:900 clamp(12px,4.2vw,17px)/1.15 var(--f-disp);letter-spacing:-.03em;margin:6px 0 5px;word-break:keep-all}
.label .lo{font:500 clamp(8px,2.5vw,10.5px)/1.2 var(--f-disp)}
.label svg.trees{width:20px;height:13px;stroke-width:3.4;margin-bottom:6px}
.label .up{position:absolute;left:12%;right:12%;bottom:56%;display:flex;flex-direction:column;align-items:center}
.label .up .ln{margin:5px 0 0}
.label .ln.s{font-size:clamp(11px,3.6vw,15px)}
.label .ln.xs{font-size:clamp(9.5px,3vw,12.5px);line-height:1.2}
.label > .lo{position:absolute;left:14%;right:14%;top:58%}
.info{padding-top:22px}
.info > *{opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .4s ease}
.sheet.ready .info > *{opacity:1;transform:none}
.sheet.ready .info > *:nth-child(2){transition-delay:.06s}.sheet.ready .info > *:nth-child(3){transition-delay:.12s}.sheet.ready .info > *:nth-child(4){transition-delay:.18s}.sheet.ready .info > *:nth-child(n+5){transition-delay:.24s}
.info .meta{font:600 10.5px/1.5 var(--f-mono);letter-spacing:.12em;color:var(--c)}
.info h2{margin:8px 0 0;font:900 32px/1.12 var(--f-disp);letter-spacing:-.04em;text-wrap:balance;word-break:keep-all}
.info .op{font:500 15px/1.4 var(--f-disp);color:var(--ink-soft);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.notes{margin:24px 0 0;border-top:1.5px solid var(--ink)}
.notes div{display:grid;grid-template-columns:76px 1fr;gap:12px;padding-block:13px;border-bottom:1px solid var(--rule)}
.notes dt{font:700 10.5px/1.6 var(--f-mono);letter-spacing:.1em}
.notes dd{margin:0;font:500 14.5px/1.6 var(--f-disp);min-width:0}
.notes dd ul{margin:0;padding:0;list-style:none}
.notes dd li{position:relative;padding-left:14px}
.notes dd li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.acts{display:grid;gap:10px;margin-top:22px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:16px 16px;border-radius:14px;border:1.5px solid var(--ink);font:700 14.5px/1.2 var(--f-disp);text-decoration:none;text-align:left}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn[aria-disabled="true"]{opacity:.5;cursor:default}
.btn small{font:600 10px/1 var(--f-mono);letter-spacing:.1em}
.sleeves{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-top:2px}
.sleeves button{flex:none;width:62%;max-width:260px;scroll-snap-align:start;aspect-ratio:4/5;border-radius:6px;overflow:hidden;box-shadow:0 8px 16px rgba(30,10,0,.18);background:var(--paper-deep)}
.sleeves img{width:100%;height:100%;object-fit:cover;display:block}
.nosleeve{aspect-ratio:4/5;width:62%;max-width:260px;border:1.5px dashed var(--ink-soft);border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:var(--ink-soft);font:600 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-align:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb .lbtop{display:flex;justify-content:space-between;align-items:center;height:52px;color:var(--paper);font:600 11px/1 var(--f-mono);letter-spacing:.12em}
.lb .strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb .strip::-webkit-scrollbar{display:none}
.lb .strip figure{flex:none;width:100%;margin:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:8px 16px 24px;box-sizing:border-box}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}

/* MIX TAPE */
.mixhead{padding-top:26px;padding-bottom:28px;min-height:200px}
.mixhead .rec{position:absolute;right:-80px;top:20px;width:210px}
.mixhead h2{margin:0;font:900 60px/.9 var(--f-disp);letter-spacing:-.05em}
.mixhead .meta{margin-top:12px;font:600 10.5px/1.7 var(--f-mono);letter-spacing:.1em;max-width:calc(100% - 140px)}
.tt{list-style:none;margin:0;padding:0}
.tt > li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding-block:16px;border-bottom:1px solid var(--rule)}
.tt .time{font:700 15px/1.2 var(--f-mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tt .time small{display:block;font:500 11px/1.4 var(--f-mono);color:var(--ink-soft);margin-top:3px}
.tt .vol{font:700 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.tt h3{margin:6px 0 0;font:900 22px/1.15 var(--f-disp);letter-spacing:-.03em}
.tt .sub{font:500 13px/1.4 var(--f-disp);color:var(--ink-soft);margin-top:3px}
.tt .onair{background:var(--onair);color:#fff;border-radius:999px;padding:4px 8px;font:700 9px/1 var(--f-mono);letter-spacing:.12em}
.tt .prog{height:3px;background:var(--rule);margin-top:10px;position:relative}
.tt .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--onair)}
.tt li.done{opacity:.45}
.busk{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.busk li{display:flex;gap:10px;align-items:baseline;font:700 15px/1.4 var(--f-disp)}
.busk li span{font:600 11.5px/1 var(--f-mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.busk li.now{color:var(--onair)}
.busk li.now span{color:var(--onair)}
.flyers{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}

/* MAP */
.floors{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.floors::-webkit-scrollbar{display:none}
.floors button{flex:none;font:700 11px/1 var(--f-mono);letter-spacing:.1em;padding:9px 12px;border-radius:999px;border:1.5px solid var(--ink)}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.floors button small{opacity:.55;margin-left:4px}
.pan{position:relative;background:var(--paper-deep);border-radius:14px;overflow:auto;height:min(62vh,420px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pan svg{display:block;width:auto;max-width:none;padding:16px;box-sizing:content-box}
.pan .mk{cursor:pointer}
.pan .mk .pulse{opacity:0;transform-box:fill-box;transform-origin:center}
.pan .mk.focus .pulse{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 18px/1 var(--f-mono)}
.mapwrap{position:relative}
.maphint{font:600 10px/1.5 var(--f-mono);letter-spacing:.1em;color:var(--ink-soft);margin-top:8px}
.soon{height:min(62vh,420px);border:1.5px dashed var(--ink-soft);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.soon b{font:900 56px/1 var(--f-disp);letter-spacing:-.04em}
.soon span{font:600 11px/1.6 var(--f-mono);letter-spacing:.12em}
.soon p{margin:0;font:500 13.5px/1.6 var(--f-disp);color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:600 10.5px/1 var(--f-mono);letter-spacing:.08em}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:22;padding-left:var(--gut);padding-right:var(--gut-r);padding-bottom:10px;transform:translateY(calc(100% + 90px));visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;pointer-events:none}
.pick.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.pick .card{max-width:560px;margin:0 auto;background:var(--white);border:1.5px solid var(--ink);border-radius:16px;padding:12px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;box-shadow:0 12px 28px rgba(30,10,0,.18)}
.pick .card .tx b{display:block;font:700 15px/1.3 var(--f-disp)}
.pick .card .tx span{display:block;font:500 12px/1.3 var(--f-disp);color:var(--ink-soft)}
.pick .card .play{background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 12px;font:700 10.5px/1 var(--f-mono);letter-spacing:.08em}

/* INFO */
.rain{padding-top:26px;padding-bottom:26px;min-height:150px}
.rain .sticker{position:absolute;right:var(--gut-r);top:20px}
.rain h2{margin:0;font:900 44px/.95 var(--f-disp);letter-spacing:-.04em}
.rain p{margin:12px 0 0;font:500 14px/1.6 var(--f-disp)}
.rain .ch{font:700 13px/1 var(--f-mono);margin-top:12px;display:flex;gap:8px;align-items:center}
.rain .ch s{opacity:.5}
.gz{color:var(--white)}
.gzband{padding-top:24px;padding-bottom:24px;border-radius:18px}
.gzband h3{margin:0;font:900 34px/1 var(--f-disp);letter-spacing:-.03em;color:var(--white)}
.gzband p{margin:8px 0 0;font:500 13.5px/1.5 var(--f-disp);color:var(--white)}
.bins{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bins li{background:var(--white);border-radius:12px;padding:12px;color:var(--ink)}
.bins li b{display:block;font:700 14px/1.3 var(--f-disp)}
.bins li span{display:block;font:900 20px/1.2 var(--f-disp);letter-spacing:-.02em;margin-top:6px;color:var(--green)}
.bins li span small{font:600 10px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-soft);display:block;margin-bottom:3px}
.bins li.wide{grid-column:1/-1}
.rsv{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}

.rsv .tx b{display:block;font:700 15px/1.3 var(--f-disp)}
.rsv .tx span{display:block;font:500 12.5px/1.45 var(--f-disp);color:var(--ink-soft);margin-top:2px}

/* INTRO: close-up on the record, needle drops, then the view pulls back and fades into the app */
.intro{position:fixed;inset:0;z-index:80;background:url(img/grain_soft.png),var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity 1.7s ease}
.intro.out{opacity:0;pointer-events:none}
.deck{position:relative;width:min(76vw,330px);transform:scale(2.6);transform-origin:84% 34%;transition:transform 2s cubic-bezier(.55,0,.2,1)}

.ihint,.inow{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);white-space:nowrap;font:700 11px/1 var(--f-mono);letter-spacing:.16em;background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:9px;transition:opacity .4s ease}

.inow{opacity:0;background:transparent;color:var(--ink);font-size:10px}

/* ============ time (KST) ============ */
function kstNow(){
  const d = window.__NOW ? new Date(window.__NOW) : new Date();
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, min:(+p.hour%24)*60 + +p.minute };
}
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
function stageState(){
  const n = kstNow();
  if (n.date < FEST.date){
    const days = Math.round((Date.parse(FEST.date) - Date.parse(n.date))/864e5);
    return { mode:'before', days };
  }
  if (n.date > FEST.date) return { mode:'after' };
  for (const s of SET){
    const a=toMin(s.s), b=toMin(s.e);
    if (n.min>=a && n.min<b){
      let act=null;
      if (s.acts){ for (let i=s.acts.length-1;i>=0;i--){ if (n.min>=toMin(s.acts[i][0])){ act=s.acts[i]; break; } } }
      return { mode:'live', set:s, act, pct:(n.min-a)/(b-a), min:n.min };
    }
  }
  if (n.min < toMin(SET[0].s)) return { mode:'today', min:n.min };
  return { mode:'after' };
}

/* ============ sound ============ */
const Sound = {
  ctx:null, on: true,
  init(){ if(this.ctx) { this.ctx.resume?.(); return; } const C=window.AudioContext||window.webkitAudioContext; if(!C) return; this.ctx=new C(); this.out=this.ctx.createGain(); this.out.gain.value=.9; this.out.connect(this.ctx.destination); },
  ok(){ return this.on && this.ctx; },
  buf(sec){ const sr=this.ctx.sampleRate, n=Math.floor(sr*sec), b=this.ctx.createBuffer(1,n,sr), d=b.getChannelData(0); let last=0;
    for(let i=0;i<n;i++){ let v=(Math.random()*2-1)*.05; last=last*.97+v*.03; v=v*.6+last; if(Math.random()<.0011) v+=(Math.random()*2-1)*.85; if(Math.random()<.00012) v+=(Math.random()<.5?-1:1)*1; d[i]=v; } return b; },
  crackle(sec=1.4, vol=.55){ if(!this.ok()) return; const c=this.ctx,t=c.currentTime,s=c.createBufferSource(); s.buffer=this.buf(sec);
    const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=700; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7000;
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04); g.gain.setValueAtTime(vol,t+sec*.65); g.gain.linearRampToValueAtTime(0,t+sec);
    s.connect(hp).connect(lp).connect(g).connect(this.out); s.start(t); },
  thump(vol=.7){ if(!this.ok()) return; const c=this.ctx,t=c.currentTime; const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(38,t+.18);
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g).connect(this.out); o.start(t); o.stop(t+.32);
    const s=c.createBufferSource(); s.buffer=this.buf(.12); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1600; const g2=c.createGain(); g2.gain.setValueAtTime(.9,t); g2.gain.exponentialRampToValueAtTime(.001,t+.12); s.connect(f).connect(g2).connect(this.out); s.start(t); },
  hum(sec=2.2){ if(!this.ok()) return; const c=this.ctx,t=c.currentTime,o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(42,t); o.frequency.linearRampToValueAtTime(55,t+.8);
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.06,t+.5); g.gain.linearRampToValueAtTime(0,t+sec); o.connect(g).connect(this.out); o.start(t); o.stop(t+sec); }

function spinRecord(el, enter){
  cancelAnimationFrame(spinRAF);
  if (reduce){ el.style.transform='none'; return; }
  const total=720, dur=1600, t0=performance.now();
  const step = t => { const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    const ang = -total*(1-e); const ty = enter ? (1-Math.min(1,p/.45))*45 : 0; const e2 = 1-Math.pow(1-Math.min(1,p/.45),3);
    el.style.transform = `translateY(${enter? (1-e2)*45 : 0}%) rotate(${ang}deg)`;
    if (p<1) spinRAF=requestAnimationFrame(step); };
  spinRAF=requestAnimationFrame(step);
}
function openBooth(id, push=true){
  const b=byId(id); if(!b) return;
  current=b; $('#pick').classList.remove('show');
  sheet.hidden=false; sheet.classList.remove('ready');
  sheet.innerHTML=boothHTML(b); sheet.scrollTop=0;
  requestAnimationFrame(()=>{ sheet.classList.add('open'); });
  const rec=sheet.querySelector('.stage .rec');
  spinRecord(rec, true);
  setTimeout(()=>sheet.classList.add('ready'), reduce?0:650);
  rec.addEventListener('click',()=>{ spinRecord(rec,false); });
  if (push){ const h='#track-'+b.id.toLowerCase(); if(location.hash!==h) history.pushState(null,'',h); }
}
function closeBooth(){
  sheet.classList.remove('open','ready'); current=null;
  setTimeout(()=>{ if(!current) sheet.hidden=true; }, 380);
}
sheet.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if (t.hasAttribute('data-close')){ if (history.length>1 && lastBase) { location.hash = lastBase; } else { location.hash='#tracks'; } return; }
  if (t.dataset.step){ const i=BOOTHS.indexOf(current); const n=BOOTHS[(i+ +t.dataset.step + BOOTHS.length)%BOOTHS.length]; history.replaceState(null,'','#track-'+n.id.toLowerCase()); openBooth(n.id,false); return; }
  if (t.dataset.lb!==undefined){ openLB((current.posters||[]).map(img), +t.dataset.lb); }
});

  strip.addEventListener('scroll',()=>{ $('#lbc').textContent = `${Math.round(strip.scrollLeft/strip.clientWidth)+1} / ${list.length}`; },{passive:true});
}
lb.addEventListener('click',e=>{ if(e.target.closest('[data-x]') || e.target.tagName==='FIGURE') { lb.hidden=true; lb.innerHTML=''; } });
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!lb.hidden){ lb.hidden=true; lb.innerHTML=''; } else if(current){ location.hash = lastBase||'#tracks'; } } });

/* ============ router ============ */
const app=$('#app'); let lastBase='#home', base='';
function render(name){
  base=name; app.innerHTML=`<div class="view">${V[name]()}</div>`;
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===name) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (name==='tracks') applyFilter();
  if (name==='map') paintFloor();
  if (name!=='map') $('#pick').classList.remove('show');
}
function route(){
  const h=(location.hash||'#home').slice(1);
  let m;
  if ((m=h.match(/^track-([a-z0-9]+)$/))){ if(!base){ render('tracks'); lastBase='#tracks'; } openBooth(m[1], false); return; }
  if (current) closeBooth();
  if ((m=h.match(/^map-([a-z0-9]+)$/))){ floor='1F'; render('map'); lastBase='#map'; setTimeout(()=>focusMarker(m[1].toUpperCase()), 250); return; }
  if (h==='side-a' || h==='side-b'){ render('tracks'); lastBase='#'+h; const sec=$(`#${h}-sec`); requestAnimationFrame(()=>{ if(h==='side-b' && sec) window.scrollTo({top: sec.getBoundingClientRect().top + scrollY - 100}); else window.scrollTo(0,0); }); return; }
  const name = V[h] ? h : 'home';
  render(name); lastBase='#'+name; window.scrollTo(0,0);
}
addEventListener('hashchange', route);

app.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if (t.dataset.open){ e.preventDefault(); openBooth(t.dataset.open); return; }
  if (t.dataset.genre){ filter=t.dataset.genre; location.hash='#tracks'; return; }
  if (t.dataset.filter){ filter=t.dataset.filter; applyFilter(); return; }
  if (t.dataset.floor){ floor=t.dataset.floor; zoom=1; paintFloor(); showPick(null); return; }
  if (t.dataset.zoom){ setZoom(+t.dataset.zoom); return; }
  if (t.dataset.focus){ floor='1F'; paintFloor(); setTimeout(()=>focusMarker(t.dataset.focus),60); return; }
  if (t.dataset.lb!==undefined && t.dataset.set==='flyers'){ openLB(FLYERS.map(img), +t.dataset.lb); }
});
app.addEventListener('click',e=>{
  const mk=e.target.closest('.pan .mk'); if(!mk) return;
  const pan=$('#pan'); pan.querySelectorAll('.mk').forEach(x=>x.classList.toggle('focus', x===mk));
  showPick(byId(mk.dataset.id));
});
$('#pick').addEventListener('click',e=>{ const t=e.target.closest('[data-open]'); if(t) openBooth(t.dataset.open); });
addEventListener('popstate',()=>{});

/* ============ intro ============ */
const intro=$('#intro');
function runIntro(){
  intro.hidden=false; const rec=$('#introRec'); let started=false;
  const go=()=>{
    if(started) return; started=true;
    Sound.init(); Sound.crackle(.9,.35); intro.classList.add('play');
    setTimeout(()=>{ Sound.thump(.8); Sound.crackle(3.4,.6); Sound.hum(3.2); rec.classList.add('spin'); }, reduce?0:950);
    setTimeout(()=>{ intro.classList.add('out'); setTimeout(()=>{ intro.hidden=true; }, 2100); }, reduce?300:1900);
  };
  intro.addEventListener('click',go); intro.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
}
document.addEventListener('pointerdown',()=>Sound.init(),{once:true});

route();
if (!location.hash || location.hash==='#home') runIntro();
setInterval(()=>{ if(base==='home'||base==='mixtape'){ const y=scrollY; render(base); window.scrollTo(0,y);} }, 60000);
</script>

</html>
