<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE1">
<title>THE B FOREST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: a record crate in your pocket. Paper pages, grain-gradient bands per deck, booths are tracks on an LP.
   Type: three levels only. Title (Noto 900) / Body (Noto 500) / Tag (Plex Mono, sparingly). Spacing: 8 · 16 · 32. */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#F4EEE1; --paper-deep:#EAE1CF; --ink:#151413; --ink-soft:#5E574F; --rule:rgba(21,20,19,.14);
  --food:#D9482B; --play:#2B64A8; --make:#7650B0; --green:#2E8B4E; --dot:#F7CE3E; --onair:#E2483A;
  --white:#FFFDF8; --shade:rgba(21,20,19,.94);
  --g-a:linear-gradient(160deg,#EA5A46 0%,#F08A5A 34%,#F6C9A4 68%,#F7EEE2 100%);
  --g-b:linear-gradient(160deg,#78AFE2 0%,#AFD3EE 40%,#DCEDC0 76%,#F2F3E2 100%);
  --g-mix:linear-gradient(118deg,#EC6550 0%,#F4AA78 32%,#F1E5D8 54%,#B7D6EE 78%,#93C2E8 100%);
  --g-food:linear-gradient(160deg,#E0473A 0%,#F09A84 52%,#F8E3D7 100%);
  --g-play:linear-gradient(160deg,#2D63AD 0%,#86B4E1 52%,#E5EEF4 100%);
  --g-make:linear-gradient(160deg,#7954B3 0%,#C49AD6 52%,#F3E4EE 100%);
  --g-green:linear-gradient(160deg,#2B7C47 0%,#8DC38A 52%,#E7F1D8 100%);
  --l-food:radial-gradient(circle at 35% 30%,#FFF3EE,#F6C2B4);
  --l-play:radial-gradient(circle at 35% 30%,#F3F9FE,#BCD9F2);
  --l-make:radial-gradient(circle at 35% 30%,#FBF2F8,#CDB6E6);
  --l-green:radial-gradient(circle at 35% 30%,#F3FBEF,#C6E6B4);
  --f-disp:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,"Noto Sans KR",monospace;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  --nav-h:62px; --top-h:52px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;word-break:keep-all;background:url(img/grain_soft.png),var(--paper);color:var(--ink);font-family:var(--f-disp);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:var(--gut);padding-right:var(--gut-r)}
.band{position:relative;isolation:isolate;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background:url(img/grain.png);opacity:.55;z-index:-1;pointer-events:none}
.g-a{background:var(--g-a)} .g-b{background:var(--g-b)} .g-mix{background:var(--g-mix)}
.g-FOOD{background:var(--g-food)} .g-PLAY{background:var(--g-play)} .g-MAKE{background:var(--g-make)} .g-GREEN{background:var(--g-green)}
.c-FOOD{--c:var(--food)} .c-PLAY{--c:var(--play)} .c-MAKE{--c:var(--make)} .c-GREEN{--c:var(--green)}
svg.trees{width:26px;height:18px;stroke:currentColor;fill:none;stroke-width:3.2}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag{font:600 10.5px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.h-sec{margin:0;padding-top:32px;padding-bottom:12px;font:900 19px/1.3 var(--f-disp);letter-spacing:-.02em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--top-h);background:var(--paper);border-bottom:1px solid var(--rule)}
.top .l{justify-self:start;display:flex;align-items:center;gap:8px;font:700 14px/1 var(--f-disp)}
.top .l svg.trees{width:24px}
.top .back{display:flex;align-items:center;gap:6px;font:700 15px/1 var(--f-disp);padding:10px 12px 10px 0}
.top .back svg{width:20px;height:20px}
.top .t{font:900 16px/1 var(--f-disp);letter-spacing:-.01em}
.top .r{justify-self:end}
.mus{display:flex;align-items:center;gap:7px;border:1.5px solid var(--ink);border-radius:999px;padding:6px 11px;font:700 12px/1 var(--f-disp)}
.mus[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.eq{display:flex;align-items:flex-end;gap:2px;height:11px}
.eq b{width:2.5px;height:4px;background:currentColor;border-radius:1px}
.mus[aria-pressed="true"] .eq b{animation:eq .9s ease-in-out infinite}
.mus[aria-pressed="true"] .eq b:nth-child(2){animation-delay:-.3s}.mus[aria-pressed="true"] .eq b:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:var(--gut);padding-right:var(--gut-r)}
.nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);max-width:560px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:100%;font:700 11.5px/1 var(--f-disp);opacity:.5}
.nav a[aria-current="page"]{opacity:1;color:var(--dot)}
main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
.view{animation:vin .28s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* records */
.rec{position:relative;aspect-ratio:1;border-radius:50%;max-width:100%}
.rec img{width:102.6%;height:102.6%;margin:-1.3%;display:block;max-width:none}
.spin{animation:spin var(--rpm,1.8s) linear infinite}
.spin.r45{--rpm:1.33s}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;left:27.1%;top:27.1%;width:45.8%;height:45.8%;border-radius:50%;color:var(--ink);overflow:hidden;text-align:center}
.label::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 9px,rgba(0,0,0,.05) 9px 10px);pointer-events:none}
.label .hole{position:absolute;left:50%;top:50%;width:5%;height:5%;margin:-2.5% 0 0 -2.5%;border-radius:50%;background:#0b0b0b;z-index:2}
.label .up{position:absolute;left:12%;right:12%;bottom:56%;display:flex;flex-direction:column;align-items:center}
.label .lt{font:700 clamp(7px,2.2vw,9px)/1 var(--f-mono);letter-spacing:.12em}
.label .ln{font:900 clamp(12px,4.2vw,17px)/1.15 var(--f-disp);letter-spacing:-.03em;margin-top:5px}
.label .ln.s{font-size:clamp(11px,3.6vw,15px)} .label .ln.xs{font-size:clamp(9.5px,3vw,12.5px);line-height:1.2}
.label > .lo{position:absolute;left:14%;right:14%;top:58%;font:500 clamp(8px,2.5vw,10.5px)/1.2 var(--f-disp)}
.label svg.trees{width:20px;height:13px;stroke-width:3.4;margin-bottom:6px}
.l-FOOD{background:var(--l-food)} .l-PLAY{background:var(--l-play)} .l-MAKE{background:var(--l-make)} .l-GREEN{background:var(--l-green)}

/* HOME */
.hero{padding-top:32px;padding-bottom:32px}
.hero h1{margin:0;font:900 clamp(60px,20vw,104px)/.86 var(--f-disp);letter-spacing:-.05em}
.hero .copy{margin:24px 0 0;font:700 20px/1.45 var(--f-disp);letter-spacing:-.02em}
.hero .when{margin-top:16px;font:500 14px/1.5 var(--f-disp)}
.hero .when b{font-weight:700}
.now{display:grid;grid-template-columns:48px 1fr 20px;align-items:center;gap:16px;padding-block:16px;border-bottom:1px solid var(--rule);width:100%}
.now .rec{width:48px}
.now .k{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--f-disp);color:var(--ink-soft)}
.now .k i{width:8px;height:8px;border-radius:50%;background:var(--onair);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.now .t{font:900 18px/1.3 var(--f-disp);letter-spacing:-.02em;margin-top:4px}
.now .bar{height:3px;background:var(--rule);margin-top:8px;position:relative}
.now .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--onair)}
.chev{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.menu a{display:grid;grid-template-columns:48px 1fr 20px;gap:16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--rule)}
.menu .ico{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
.menu b{display:block;font:900 19px/1.25 var(--f-disp);letter-spacing:-.02em}
.menu span{display:block;font:500 13px/1.4 var(--f-disp);color:var(--ink-soft);margin-top:2px}
.console{border-radius:18px;padding:16px 12px;display:grid;grid-template-columns:1fr 64px 1fr;gap:8px;align-items:start}
.deckbtn{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.deckbtn .rec{width:96%;box-shadow:0 10px 16px rgba(40,20,10,.28)}
.deckbtn b{display:block;font:900 15px/1.2 var(--f-disp);letter-spacing:-.02em}
.deckbtn span{display:block;font:500 12px/1.4 var(--f-disp)}
.mixbtn{display:flex;flex-direction:column;align-items:center;gap:8px}
.mixbtn svg{width:100%;height:auto}
.mixbtn b{font:900 12px/1.25 var(--f-disp);text-align:center}
.foot{padding-top:32px;font:500 13px/1.7 var(--f-disp);color:var(--ink-soft)}
.foot a{font-weight:700;color:var(--ink);text-decoration:underline}

/* BOOTHS */
.filt{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));z-index:15;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font:700 13px/1 var(--f-disp)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sidehead{padding-top:24px;padding-bottom:24px;min-height:168px}
.sidehead .rec{position:absolute;right:-64px;top:16px;width:176px}
.sidehead h2{margin:8px 0 0;font:900 36px/1.05 var(--f-disp);letter-spacing:-.04em}
.sidehead p{margin:8px 0 0;font:500 14px/1.5 var(--f-disp);max-width:calc(100% - 120px)}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-bottom:1px solid var(--rule)}
.trk{display:grid;grid-template-columns:40px 1fr auto 20px;gap:12px;align-items:center;width:100%;text-align:left;padding-block:16px}
.badge{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:900 13px/1 var(--f-disp);letter-spacing:-.02em}
.badge.gz{font:700 8px/1 var(--f-mono)}
.trk .n{display:block;font:700 16px/1.35 var(--f-disp);letter-spacing:-.01em}
.nmr{display:flex;align-items:baseline;gap:8px;min-width:0}.nmr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team{flex:none;font:600 13px/1 var(--f-disp);font-style:normal;color:var(--ink-soft);letter-spacing:-.01em}
.trk .o{display:block;font:500 13px/1.4 var(--f-disp);color:var(--ink-soft);margin-top:2px}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font:700 11px/1 var(--f-disp);border:1.2px solid var(--ink);border-radius:999px;padding:5px 8px;white-space:nowrap}
.pill.fill{background:var(--ink);color:var(--paper)}
.trk .chev{color:var(--ink-soft)}
.empty{padding:24px 0;font:500 14px/1.6 var(--f-disp);color:var(--ink-soft)}

/* SHEET */
.sheet{position:fixed;inset:0;z-index:40;background:url(img/grain_soft.png),var(--paper);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .bar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;height:var(--top-h);background:var(--paper);border-bottom:1px solid var(--rule)}
.sheet .bar button{display:flex;align-items:center;gap:6px;font:700 15px/1 var(--f-disp);padding:10px 0}
.sheet .bar .tn{display:flex;gap:20px}
.sheet .bar .tn button{font-size:14px}
.stage{padding-top:24px;padding-bottom:24px;display:flex;justify-content:center}
.stage .rec{width:min(76vw,322px);box-shadow:0 18px 30px rgba(30,10,0,.3)}
.info{padding-top:24px}
.info > *{opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .4s ease}
.sheet.ready .info > *{opacity:1;transform:none}
.sheet.ready .info > *:nth-child(2){transition-delay:.06s}.sheet.ready .info > *:nth-child(3){transition-delay:.12s}.sheet.ready .info > *:nth-child(n+4){transition-delay:.18s}
.info .meta{font:700 13px/1.4 var(--f-disp);color:var(--c)}
.info h2{margin:8px 0 0;font:900 30px/1.15 var(--f-disp);letter-spacing:-.04em;text-wrap:balance}
.info h2.h-sec{margin:0;font:900 19px/1.3 var(--f-disp);letter-spacing:-.02em}
.info .op{font:500 15px/1.4 var(--f-disp);color:var(--ink-soft);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.notes{margin:24px 0 0;border-top:1.5px solid var(--ink)}
.notes div{display:grid;grid-template-columns:64px 1fr;gap:16px;padding-block:14px;border-bottom:1px solid var(--rule)}
.notes dt{font:700 13px/1.6 var(--f-disp);color:var(--ink-soft)}
.notes dd{margin:0;font:500 15px/1.6 var(--f-disp);min-width:0}
.notes dd ul{margin:0;padding:0;list-style:none}
.notes dd li{position:relative;padding-left:16px}
.notes dd li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.acts{display:grid;gap:8px;margin-top:24px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--ink);font:700 16px/1.2 var(--f-disp);text-align:left}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn[aria-disabled="true"]{opacity:.45;cursor:default}
.sleeves{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.sleeves button{flex:none;width:64%;max-width:260px;scroll-snap-align:start;aspect-ratio:4/5;border-radius:6px;overflow:hidden;box-shadow:0 8px 16px rgba(30,10,0,.18);background:var(--paper-deep)}
.sleeves img{width:100%;height:100%;object-fit:cover;display:block}
.nosleeve{aspect-ratio:4/5;width:64%;max-width:260px;border:1.5px dashed var(--ink-soft);border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:var(--ink-soft);font:700 13px/1.5 var(--f-disp);text-align:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb .lbtop{display:flex;justify-content:space-between;align-items:center;height:var(--top-h);color:var(--paper);font:700 14px/1 var(--f-disp)}
.lb .lbtop button{color:var(--paper);font:700 15px/1 var(--f-disp);padding:10px 0}
.lb .strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb .strip::-webkit-scrollbar{display:none}
.lb figure{flex:none;width:100%;margin:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:8px 16px 24px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}

/* SHOW */
.head{padding-top:24px;padding-bottom:24px;min-height:168px}
.head .rec{position:absolute;right:-72px;top:14px;width:190px}
.head h2{margin:8px 0 0;font:900 36px/1.05 var(--f-disp);letter-spacing:-.04em}
.head p{margin:8px 0 0;font:500 14px/1.5 var(--f-disp);max-width:calc(100% - 120px)}
.tt{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.tt > li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;padding-block:22px;border-bottom:1px solid var(--rule)}
.tt .time{font:700 16px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.tt .time small{display:none;font:500 12px/1.4 var(--f-mono);color:var(--ink-soft);margin-top:4px}
.tt .ln1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tt h3{margin:0;font:900 18px/1.25 var(--f-disp);letter-spacing:-.03em}
.tt .sub{font:500 13px/1.3 var(--f-disp);color:var(--ink-soft)}
.tt .ln1 .onair{align-self:center}
.onair{background:var(--onair);color:#fff;border-radius:999px;padding:4px 8px;font:700 10px/1 var(--f-mono);letter-spacing:.1em}
.tt .prog{height:3px;background:var(--rule);margin-top:8px;position:relative}
.tt .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--onair)}
.tt li.done{opacity:.45}
.busk{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.busk li{display:flex;gap:8px;align-items:baseline;font:700 15px/1.4 var(--f-disp)}
.busk li span{font:600 12px/1 var(--f-mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.busk li.now,.busk li.now span{color:var(--onair)}
.flyers{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}

/* MAP */
.floors{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.floors::-webkit-scrollbar{display:none}
.floors button{flex:none;font:700 13px/1 var(--f-disp);padding:9px 14px;border-radius:999px;border:1.5px solid var(--ink)}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mapwrap{position:relative}
.pan{position:relative;background:var(--paper-deep);border-radius:14px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:62vh}
.pan svg{display:block;width:100%;height:auto;max-width:none;padding:12px;box-sizing:content-box}
.pan .mk{cursor:pointer}
.pan .mk .pulse{opacity:0;transform-box:fill-box;transform-origin:center}
.pan .mk.focus .pulse{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.zoom{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.zoom button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font:700 13px/1 var(--f-disp)}
.zoom button[disabled]{opacity:.35;cursor:default}
.soon{min-height:280px;border:1.5px dashed var(--ink-soft);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
.soon b{font:900 44px/1 var(--f-disp);letter-spacing:-.04em}
.soon p{margin:0;font:500 14px/1.6 var(--f-disp);color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font:700 13px/1 var(--f-disp)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:22;padding-left:var(--gut);padding-right:var(--gut-r);padding-bottom:12px;transform:translateY(calc(100% + 90px));visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;pointer-events:none}
.pick.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.pick .card{max-width:560px;margin:0 auto;background:var(--white);border:1.5px solid var(--ink);border-radius:16px;padding:12px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;box-shadow:0 12px 28px rgba(30,10,0,.18)}
.pick .tx b{display:block;font:700 15px/1.3 var(--f-disp)}
.pick .tx > span{display:block;font:500 12.5px/1.35 var(--f-disp);color:var(--ink-soft)}
.pick .tx .nmr{display:flex}.pick .tx .nm{font:inherit;color:inherit}
.pick .go{background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 14px;font:700 13px/1 var(--f-disp)}

/* INFO */
.gzband{padding:24px 16px;border-radius:18px;color:var(--white)}
.gzband h3{margin:0;font:900 30px/1 var(--f-disp);letter-spacing:-.03em}
.gzband p{margin:8px 0 0;font:500 14px/1.5 var(--f-disp)}
.bins{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bins li{background:var(--white);border-radius:12px;padding:12px;color:var(--ink)}
.bins li b{display:block;font:700 14px/1.3 var(--f-disp)}
.bins li span{display:block;font:900 19px/1.25 var(--f-disp);letter-spacing:-.02em;margin-top:4px;color:var(--green)}
.bins li.wide{grid-column:1/-1}
.rsv{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.rsv li{border-bottom:1px solid var(--rule)}
.rsv button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding-block:14px}
.rsv .tx b{display:block;font:700 15px/1.3 var(--f-disp)}
.rsv .tx span{display:block;font:500 13px/1.45 var(--f-disp);color:var(--ink-soft);margin-top:2px}
.small{font:500 13px/1.6 var(--f-disp);color:var(--ink-soft);margin:12px 0 0}
.about{margin:0;border-top:1.5px solid var(--ink)}
.about div{padding-block:16px;border-bottom:1px solid var(--rule)}
.about dt{font:900 24px/1.1 var(--f-disp);letter-spacing:-.03em}
.about dd{margin:8px 0 0;font:500 15px/1.7 var(--f-disp)}
.setup{display:grid;gap:8px}
.setup > div{border-radius:16px;padding:20px 16px}
.setup b{display:block;font:900 24px/1.2 var(--f-disp);letter-spacing:-.03em;margin-top:8px}
.setup p{margin:8px 0 0;font:500 14.5px/1.65 var(--f-disp)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 18px;font:700 13.5px/1 var(--f-disp);transition:opacity .25s ease,transform .25s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* INTRO: whole record on the platter, needle comes in, then a slow push-in and fade into the app */
.intro{position:fixed;inset:0;z-index:80;background:url(img/grain_soft.png),var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;overflow:hidden;cursor:pointer;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:opacity 1.6s ease}
.intro.out{opacity:0;pointer-events:none}
.intro .logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transform:scale(.97);transition:opacity .9s ease,transform 1.6s ease;pointer-events:none}
.intro .logo svg.trees{width:96px;height:66px;stroke-width:2.6}
.intro .logo b{font:900 34px/1 var(--f-disp);letter-spacing:-.03em}
.intro .logo span{font:700 11px/1 var(--f-mono);letter-spacing:.24em}
.intro.s1 .logo{opacity:1;transform:none}
.intro .deck,.intro .ihint{opacity:0;transition:opacity 1s ease,transform 2.2s cubic-bezier(.5,0,.2,1)}
.intro.s2 .deck,.intro.s2 .ihint{opacity:1}
.deck{position:relative;width:min(72vw,320px);margin-right:10vw;transition:transform 2.2s cubic-bezier(.5,0,.2,1)}
.intro.out .deck{transform:scale(1.35)}
.deck .rec{width:97.5%;margin:1.25%;box-shadow:0 22px 36px rgba(30,10,0,.3)}
.arm{position:absolute;width:30%;right:-17%;top:-6%;transform-origin:72% 9%;transform:rotate(-6deg);transition:transform 1s cubic-bezier(.5,0,.2,1);pointer-events:none}
.intro.play .arm{transform:rotate(17deg)}
.ihint{display:flex;align-items:center;gap:10px;font:700 14px/1 var(--f-disp);background:var(--ink);color:var(--paper);border-radius:999px;padding:14px 20px;transition:opacity .4s ease}
.ihint i{width:8px;height:8px;border-radius:50%;background:var(--dot);animation:blink 1.2s steps(2) infinite}
.intro.s2.play .ihint{opacity:0}

@media (prefers-reduced-motion:reduce){
  .spin,.ihint i,.now .k i,.pan .mk.focus .pulse,.view,.eq b{animation:none!important}
  .sheet,.pick,.intro,.arm,.deck{transition:none}
}
@media (min-width:640px){ main,.top,.filt{max-width:560px;margin-left:auto;margin-right:auto} }

/* time (KST) */
function kstNow(){
  const d = window.__NOW ? new Date(window.__NOW) : new Date();
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, min:(+p.hour%24)*60 + +p.minute };
}
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
function stageState(){
  const n=kstNow();
  if (n.date < FEST.date) return { mode:'before', days:Math.round((Date.parse(FEST.date)-Date.parse(n.date))/864e5) };
  if (n.date > FEST.date) return { mode:'after' };
  for (const s of SET){ const a=toMin(s.s), b=toMin(s.e);
    if (n.min>=a && n.min<b){ let act=null; if (s.acts){ for (let i=s.acts.length-1;i>=0;i--){ if(n.min>=toMin(s.acts[i][0])){act=s.acts[i];break;} } }
      return { mode:'live', set:s, act, pct:(n.min-a)/(b-a), min:n.min }; } }
  if (n.min < toMin(SET[0].s)) return { mode:'today', min:n.min };
  return { mode:'after', min:n.min };
}

/* ============ sound ============ */
const Sound = {
  ctx:null, on: true,
  init(){ if(this.ctx) { this.ctx.resume?.(); return; } const C=window.AudioContext||window.webkitAudioContext; if(!C) return; this.ctx=new C(); this.out=this.ctx.createGain(); this.out.gain.value=.9; this.out.connect(this.ctx.destination); },
  ok(){ return this.on && this.ctx; },
  buf(sec){ const sr=this.ctx.sampleRate, n=Math.floor(sr*sec), b=this.ctx.createBuffer(1,n,sr), d=b.getChannelData(0); let last=0;
    for(let i=0;i<n;i++){ let v=(Math.random()*2-1)*.05; last=last*.97+v*.03; v=v*.6+last; if(Math.random()<.0011) v+=(Math.random()*2-1)*.85; if(Math.random()<.00012) v+=(Math.random()<.5?-1:1)*1; d[i]=v; } return b; },
  crackle(sec=1.4, vol=.55){ if(!this.ok()) return; const c=this.ctx,t=c.currentTime,s=c.createBufferSource(); s.buffer=this.buf(sec);
    const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=700; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7000;
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04); g.gain.setValueAtTime(vol,t+sec*.65); g.gain.linearRampToValueAtTime(0,t+sec);
    s.connect(hp).connect(lp).connect(g).connect(this.out); s.start(t); },
  thump(vol=.7){ if(!this.ok()) return; const c=this.ctx,t=c.currentTime; const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(38,t+.18);
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g).connect(this.out); o.start(t); o.stop(t+.32);
    const s=c.createBufferSource(); s.buffer=this.buf(.12); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1600; const g2=c.createGain(); g2.gain.setValueAtTime(.9,t); g2.gain.exponentialRampToValueAtTime(.001,t+.12); s.connect(f).connect(g2).connect(this.out); s.start(t); },
  hum(sec=2.2){ if(!this.ok()) return; const c=this.ctx,t=c.currentTime,o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(42,t); o.frequency.linearRampToValueAtTime(55,t+.8);

function setZoom(z, keep=true){
  const pan=$('#pan'); if(!pan) return; const svg=pan.querySelector('svg');
  const cx = pan.scrollWidth>pan.clientWidth ? (pan.scrollLeft+pan.clientWidth/2)/pan.scrollWidth : .5;
  const cy = pan.scrollHeight>pan.clientHeight ? (pan.scrollTop+pan.clientHeight/2)/pan.scrollHeight : .5;
  zoom = Math.max(0, Math.min(ZOOMS.length-1, z));
  const fit = pan.clientWidth - 24;
  svg.style.width = Math.round(fit*ZOOMS[zoom])+'px';
  const bar=$('#zoomBar'); if(bar){ bar.children[0].disabled = zoom===0; bar.children[1].disabled = zoom===ZOOMS.length-1; }
  if (keep) requestAnimationFrame(()=>{ pan.scrollLeft=cx*pan.scrollWidth-pan.clientWidth/2; pan.scrollTop=cy*pan.scrollHeight-pan.clientHeight/2; });
}
function focusMarker(id){
  const pan=$('#pan'); if(!pan) return; const svg=pan.querySelector('svg');
  if (zoom<1) setZoom(1,false);
  pan.querySelectorAll('.mk').forEach(m=>m.classList.toggle('focus', m.dataset.id===id));
  const m=pan.querySelector(`.mk[data-id="${id}"]`); if(!m) return;
  const [x,y]=(m.getAttribute('transform').match(/[-\d.]+/g)||[0,0]).map(Number);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const vb=svg.viewBox.baseVal, k=parseFloat(svg.style.width)/vb.width;
    pan.scrollLeft = 12 + (x-vb.x)*k - pan.clientWidth/2;
    pan.scrollTop  = 12 + (y-vb.y)*k - pan.clientHeight/2;
    const top = pan.getBoundingClientRect().top + scrollY - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-h'))||52) - 70;
    window.scrollTo({ top: Math.max(0,top), behavior: reduce?'auto':'smooth' });
  }));
  showPick(byId(id));
}

        <a class="btn" href="#map-${b.id.toLowerCase()}">지도에서 위치 보기${chev}</a>
      </div>
      <div><h2 class="h-sec">포스터</h2>${P.length?`<div class="sleeves">${P.map((p,k)=>`<button data-lb="${k}"><img src="${img(p)}" alt="${esc(b.name)} 포스터 ${k+1}" loading="lazy"></button>`).join('')}</div>`:`<div class="nosleeve">${trees()}포스터<br>곧 올라와요</div>`}</div>
      <div style="height:32px"></div>
    </div>`;
}
function spin(el, enter){
  cancelAnimationFrame(spinRAF); if(reduce){ el.style.transform='none'; return; }
  const total=720, dur=1600, t0=performance.now();
  const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), q=1-Math.pow(1-Math.min(1,p/.45),3);
    el.style.transform=`translateY(${enter?(1-q)*45:0}%) rotate(${-total*(1-e)}deg)`; if(p<1) spinRAF=requestAnimationFrame(step); };
  spinRAF=requestAnimationFrame(step);
}
function openBooth(id){
  const b=byId(id); if(!b) return; current=b; $('#pick').classList.remove('show');
  sheet.hidden=false; sheet.classList.remove('ready'); sheet.innerHTML=boothHTML(b); sheet.scrollTop=0;
  requestAnimationFrame(()=>sheet.classList.add('open'));
  const rec=sheet.querySelector('.stage .rec'); spin(rec,true); rec.addEventListener('click',()=>spin(rec,false));
  setTimeout(()=>sheet.classList.add('ready'), reduce?0:650);
}
function closeSheet(){ sheet.classList.remove('open','ready'); current=null; setTimeout(()=>{ if(!current) sheet.hidden=true; },380); }
sheet.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if (t.hasAttribute('data-close')) { goBack(); return; }
  if (t.dataset.step){ const i=BOOTHS.indexOf(current), n=BOOTHS[(i + +t.dataset.step + BOOTHS.length)%BOOTHS.length]; replace('#track-'+n.id.toLowerCase()); return; }
  if (t.dataset.lb!==undefined){ openLB(current.posters.map(img), +t.dataset.lb); }
});

/* lightbox */
const lb=$('#lb');
function openLB(list,start){
  lb.innerHTML=`<div class="lbtop gut"><span id="lbc">${start+1} / ${list.length}</span><button data-x>닫기 ✕</button></div><div class="strip">${list.map(s=>`<figure><img src="${s}" alt=""></figure>`).join('')}</div>`;
  lb.hidden=false; const st=lb.querySelector('.strip'); requestAnimationFrame(()=>{ st.scrollLeft=start*st.clientWidth; });
  st.addEventListener('scroll',()=>{ $('#lbc').textContent=`${Math.round(st.scrollLeft/st.clientWidth)+1} / ${list.length}`; },{passive:true});
}
function closeLB(){ lb.hidden=true; lb.innerHTML=''; }
lb.addEventListener('click',e=>{ if(e.target.closest('[data-x]')||e.target.tagName==='FIGURE') closeLB(); });

/* ===== navigation & history =====
   Every screen change is a real history entry, so the phone / KakaoTalk back button steps back inside the app.
   A guard entry under home asks for a second back press before leaving. */
const stack=[];               // hashes visited in this tab, newest last
function go(h){ if(location.hash===h){ route(); return; } location.hash=h; }
function replace(h){ history.replaceState(null,'',h); if(stack.length) stack[stack.length-1]=h; route(true); }
function goBack(){ if(stack.length>1) history.back(); else go('#home'); }
const app=$('#app'), topBar=$('#top'); let base='';
function paintTop(name){
  const back = name!=='home';
  topBar.innerHTML = back
    ? `<button class="back l" id="backBtn"><svg class="ic"><use href="#i-back"/></svg>뒤로</button><span class="t">${TITLE[name]||''}</span>${musBtn()}`
    : `<a class="l" href="#home">${trees()}THE B FOREST</a><span></span>${musBtn()}`;
  $('#backBtn')?.addEventListener('click', goBack);
  $('#musBtn').addEventListener('click',()=>{ BGM.on ? BGM.stop() : BGM.start(0); });
}
function render(name){
  base=name; app.innerHTML=`<div class="view">${V[name]()}</div>`; paintTop(name);
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===name) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (name==='booths') applyFilter();
  if (name==='map') paintFloor(); else $('#pick').classList.remove('show');
}
let leaveArmed=0;
function route(isReplace){
  let h=(location.hash||'#home').slice(1);
  const full='#'+h;
  if (!isReplace){ if (stack.length>1 && stack[stack.length-2]===full) stack.pop(); else if (stack[stack.length-1]!==full) stack.push(full); }
  if (h==='start'){ if(!lb.hidden) closeLB(); if(current) closeSheet(); if(base!=='home') render('home');
    toast('뒤로 버튼을 한 번 더 누르면 나가요'); leaveArmed=Date.now();
    history.pushState(null,'','#home'); stack.length=0; stack.push('#home'); return; }
  if (!lb.hidden) closeLB();
  let m;
  if ((m=h.match(/^track-([a-z0-9]+)$/))){ if(!base) render('booths'); openBooth(m[1]); return; }
  const fromSheet=!!current; if (current) closeSheet();
  if (fromSheet && (base===h || (base==='booths' && (h==='side-a'||h==='side-b')))) return;
  if ((m=h.match(/^map-([a-z0-9]+)$/))){ floor='1F'; render('map'); setTimeout(()=>focusMarker(m[1].toUpperCase()),120); return; }
  if (h==='side-a'||h==='side-b'){ if(base!=='booths') render('booths'); requestAnimationFrame(()=>{ const sec=$(`#${h}-sec`); window.scrollTo({top: h==='side-a'?0:sec.getBoundingClientRect().top+scrollY-110}); }); return; }
  const name=V[h]?h:'home'; render(name); window.scrollTo(0,0);
}
addEventListener('hashchange',()=>route());

document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]'); if(a){ e.preventDefault(); go(a.getAttribute('href')); }
});
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if (t.dataset.open){ go('#track-'+t.dataset.open.toLowerCase()); return; }
  if (t.dataset.filter){ filter=t.dataset.filter; applyFilter(); return; }
  if (t.dataset.floor){ floor=t.dataset.floor; zoom=0; paintFloor(); showPick(null); return; }
  if (t.dataset.zoom){ setZoom(zoom + +t.dataset.zoom); return; }
  if (t.dataset.focus){ floor='1F'; paintFloor(); setTimeout(()=>focusMarker(t.dataset.focus),60); return; }
  if (t.dataset.flyer!==undefined){ openLB(FLYERS.map(img), +t.dataset.flyer); }
});
app.addEventListener('click',e=>{ const mk=e.target.closest('.pan .mk'); if(!mk) return;
  $('#pan').querySelectorAll('.mk').forEach(x=>x.classList.toggle('focus',x===mk)); showPick(byId(mk.dataset.id)); });
$('#pick').addEventListener('click',e=>{ const t=e.target.closest('[data-open]'); if(t) go('#track-'+t.dataset.open.toLowerCase()); });
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!lb.hidden) closeLB(); else if(current) goBack(); } });

/* intro (once per visit): logo fades in and out, then the record fades in waiting for a tap */
function runIntro(){
  const intro=$('#intro'), rec=$('#introRec'); intro.hidden=false; let ready=false, started=false;
  const t1=setTimeout(()=>intro.classList.add('s1'), 80);
  const t2=setTimeout(()=>intro.classList.remove('s1'), reduce?300:1900);
  const showLP=()=>{ clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); intro.classList.remove('s1'); intro.classList.add('s2'); ready=true; };
  const t3=setTimeout(showLP, reduce?400:2700);
  const play=()=>{ if(!ready){ showLP(); return; } if(started) return; started=true; ss.set('tbf-intro','1');
    Sound.init(); Sound.crackle(.9,.35); intro.classList.add('play'); BGM.start(); setTimeout(()=>{ try{ Sound.ctx&&Sound.ctx.suspend(); }catch(e){} },5500);
    setTimeout(()=>{ Sound.thump(.8); Sound.crackle(3.4,.6); Sound.hum(3.2); rec.classList.add('spin'); }, reduce?0:950);
    setTimeout(()=>{ intro.classList.add('out'); setTimeout(()=>intro.hidden=true, 1700); }, reduce?300:2000);
  };
  intro.addEventListener('click',play); intro.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(); } });
}

/* background music: starts quietly after the needle drops; the top-right button turns it on and off */
// 음원 파일 자체에 볼륨(0.22)과 시작 페이드인을 미리 넣어 둠. 웹오디오를 거치지 않아 아이폰에서 속도가 빨라지는 문제가 없음
const BGM = { el:null, on:false,
  ensure(){ if(this.el) return; const a=new Audio('audio/bgm2.mp3'); a.loop=true; a.preload='auto'; a.setAttribute('playsinline',''); this.el=a; },
  start(){ this.ensure(); this.on=true; const p=this.el.play(); if(p&&p.catch) p.catch(()=>{ this.on=false; paintMus(); }); paintMus(); },
  stop(){ if(!this.el) return; this.on=false; this.el.pause(); paintMus(); }
};
function musBtn(){ return `<button class="mus r" id="musBtn" aria-pressed="${BGM.on}" aria-label="배경 음악 ${BGM.on?'끄기':'켜기'}"><i class="eq"><b></b><b></b><b></b></i>${BGM.on?'음악 ON':'음악 OFF'}</button>`; }
function paintMus(){ const b=$('#musBtn'); if(!b) return; b.outerHTML=musBtn(); $('#musBtn').addEventListener('click',()=>{ BGM.on ? BGM.stop() : BGM.start(0); }); }
document.addEventListener('visibilitychange',()=>{ if(!BGM.el) return; if(document.hidden) BGM.el.pause(); else if(BGM.on) BGM.el.play().catch(()=>{}); });

/* boot */
const first = location.hash.slice(1);
if (!first || first==='home' || first==='start'){
  history.replaceState(null,'','#start'); history.pushState(null,'','#home');
  stack.push('#home'); render('home');
  if (!ss.get('tbf-intro')) runIntro();
} else {
  route();
}
setInterval(()=>{ if(base==='home'||base==='show'){ const y=scrollY; render(base); window.scrollTo(0,y); } }, 60000);
</script>

</html>
